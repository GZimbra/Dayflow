<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Dayflow capa</title>
<style>
@font-face{font-family:ManropeRegular;src:url(fonts/Manrope-Regular.ttf)}
@font-face{font-family:ManropeSemiBold;src:url(fonts/Manrope-SemiBold.ttf)}
@font-face{font-family:ManropeBold;src:url(fonts/Manrope-Bold.ttf)}
@font-face{font-family:PlexMono;src:url(fonts/IBMPlexMono-Medium.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:800px;overflow:hidden;background:#111;color:#fff;font-family:ManropeRegular;-webkit-font-smoothing:antialiased}
.wrap{position:absolute;inset:0;display:flex;align-items:center;padding:0 96px;gap:56px}
.marca{width:320px;height:320px;flex:none;filter:drop-shadow(0 30px 60px rgba(242,106,27,.28))}
h1{font-family:ManropeBold;font-size:112px;letter-spacing:-3px;line-height:1}
.tag{font-family:ManropeSemiBold;font-size:30px;line-height:1.3;color:#E9E9E6;margin-top:22px;max-width:620px}
.tag em{font-style:normal;color:#F26A1B}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px;max-width:720px}
.chip{border:1.5px solid #3A3A3A;border-radius:20px;padding:7px 14px;font-family:ManropeSemiBold;font-size:15px;color:#DADADA}
.rod{position:absolute;left:96px;right:96px;bottom:44px;display:flex;justify-content:space-between;align-items:center;font-family:PlexMono;font-size:15px;color:#8C8C8C;letter-spacing:.5px}
.rod b{color:#F26A1B;font-weight:normal}
.hor{position:absolute;left:0;right:0;bottom:92px;height:2px;background:linear-gradient(90deg,transparent,#2B2B2B 15%,#2B2B2B 85%,transparent)}
</style></head><body>
<div class="wrap">
  <img class="marca" src="marca_dayflow.svg">
  <div>
    <h1>Dayflow</h1>
    <div class="tag">Rotina de trabalho organizada: do primeiro <em>check</em> do dia ao relatório do mês.</div>
    <div class="chips"><span class="chip">Agenda e rotinas</span><span class="chip">Cronômetro por tarefa</span><span class="chip">Relatórios e gráficos</span><span class="chip">Economia gerada</span></div>
  </div>
</div>
<div class="hor"></div>
<div class="rod"><span>ANDROID · TABLET E CELULAR · .NET MAUI</span><span><b>●</b> 100% OFFLINE · DADOS SÓ NO APARELHO</span></div>
</body></html>
